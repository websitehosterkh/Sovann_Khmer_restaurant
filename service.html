<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sovann Khmer — 24/7 Service</title>
<meta name="description" content="Contact Sovann Khmer any time, day or night, on Telegram. Scan the QR code to start a chat.">
<link rel="icon" href="assets/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<style>
  :root{
    --bg:#FAF6ED; --surface:#FFFFFF; --text:#22211D; --muted:#6b6a5f;
    --emerald:#0B5B45; --emerald-dk:#073D2E; --gold:#B8912F; --gold-lt:#E3C878;
    --charcoal:#1C1B19; --border:rgba(11,91,69,.18);
    box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
    color-scheme:light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){ --bg:#121210; --surface:#1A1917; --text:#F3EEE1; --muted:#B8B2A0; --border:rgba(227,200,120,.16); color-scheme:dark; }
  }
  :root[data-theme="dark"]{ --bg:#121210; --surface:#1A1917; --text:#F3EEE1; --muted:#B8B2A0; --border:rgba(227,200,120,.16); color-scheme:dark; }
  html{scroll-behavior:smooth;}
  body{background:var(--bg); color:var(--text); font-family:'Jost',sans-serif; overflow-x:hidden; -webkit-text-size-adjust:100%;}
  *{-webkit-tap-highlight-color:transparent;}
  button,a{touch-action:manipulation;}
  .serif{font-family:'Cormorant Garamond',serif;}
  .glass{background:rgba(255,255,255,.06); backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px); border:1px solid rgba(255,255,255,.14);}
  .glow{position:fixed; width:420px; height:420px; border-radius:50%; pointer-events:none; z-index:5;
    background:radial-gradient(circle, rgba(227,200,120,.10), transparent 70%); transform:translate(-50%,-50%); transition:opacity .3s;}
  @media (max-width:768px){ .glow{display:none;} }
  .hero-aura{position:absolute; inset:-20%; pointer-events:none; z-index:0;
    background:conic-gradient(from 0deg, transparent 0 70%, rgba(227,200,120,.10) 78%, transparent 86% 100%);
    animation:auraSpin 26s linear infinite;}
  @keyframes auraSpin{to{transform:rotate(360deg)}}
  .spark{position:absolute; width:5px; height:5px; border-radius:50%; background:var(--gold-lt); opacity:0; z-index:1; pointer-events:none;
    box-shadow:0 0 10px 2px rgba(227,200,120,.5); animation:sparkRise 9s linear infinite;}
  @keyframes sparkRise{0%{transform:translateY(0);opacity:0}12%{opacity:.8}88%{opacity:.5}100%{transform:translateY(-46vh);opacity:0}}
  @keyframes floatY{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
  .float{animation:floatY 6s ease-in-out infinite;}
  .logo-hero{width:84px;height:84px;filter:drop-shadow(0 0 22px rgba(227,200,120,.55));animation:logoBreath 5s ease-in-out infinite;}
  @keyframes logoBreath{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
  .btn{position:relative;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;gap:.5rem;isolation:isolate;transition:transform .25s ease,box-shadow .25s ease,filter .25s ease;}
  .btn::after{content:"";position:absolute;top:0;left:-70%;width:45%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.45),transparent);transform:skewX(-20deg);transition:left .55s ease;pointer-events:none;}
  .btn:hover{transform:translateY(-2px);}
  .btn:hover::after{left:130%;}
  .btn:active{transform:translateY(0) scale(.97);}
  .btn-gold{background:linear-gradient(145deg,var(--gold-lt),var(--gold));color:#1a1a1a;box-shadow:0 10px 26px rgba(184,145,47,.35), inset 0 1px 0 rgba(255,255,255,.5);}
  .btn-ghost{background:rgba(255,255,255,.06);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.2);color:var(--text);}
  .qr-card{background:#fff;border-radius:1.75rem;padding:1.25rem;box-shadow:0 30px 80px rgba(0,0,0,.45), 0 0 0 1px rgba(227,200,120,.5), 0 0 60px rgba(227,200,120,.28);}
  .qr-card img{display:block;width:15rem;height:auto;border-radius:1rem;}
  .dm-btn{position:relative;display:inline-flex;align-items:center;gap:.45rem;border-radius:9999px;padding:.45rem .9rem;font-size:.78rem;letter-spacing:.04em;color:var(--gold-lt);background:linear-gradient(145deg,rgba(227,200,120,.18),rgba(11,91,69,.42));border:1px solid rgba(227,200,120,.4);box-shadow:0 6px 18px rgba(0,0,0,.28), inset 0 1px 0 rgba(255,255,255,.2);backdrop-filter:blur(14px) saturate(160%);-webkit-backdrop-filter:blur(14px) saturate(160%);transition:transform .25s ease,box-shadow .25s ease;overflow:hidden;}
  .dm-btn::after{content:"";position:absolute;top:0;left:-70%;width:45%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.4),transparent);transform:skewX(-20deg);transition:left .55s ease;pointer-events:none;}
  .dm-btn:hover{transform:translateY(-1px);box-shadow:0 10px 26px rgba(0,0,0,.34), inset 0 1px 0 rgba(255,255,255,.26);}
  .dm-btn:hover::after{left:130%;}
  .dm-btn:active{transform:translateY(0) scale(.96);}
  .dm-ico[hidden]{display:none;}
  .lang-panel{opacity:0;transform:translateY(-10px) scale(.96);transform-origin:top right;pointer-events:none;transition:opacity .22s ease,transform .34s cubic-bezier(.2,.9,.25,1.25);isolation:isolate;overflow:hidden;background:linear-gradient(145deg,rgba(244,239,222,.20),rgba(12,43,34,.36) 52%,rgba(8,29,25,.28))!important;border:1px solid rgba(255,255,255,.34)!important;box-shadow:0 24px 70px rgba(4,18,15,.34),inset 0 1px 0 rgba(255,255,255,.3),inset 0 -1px 0 rgba(255,255,255,.08);backdrop-filter:blur(38px) saturate(185%);-webkit-backdrop-filter:blur(38px) saturate(185%);}
  .lang-panel[data-open="true"]{opacity:1;transform:translateY(0) scale(1);pointer-events:auto;}
  .lang-panel::before,.lang-panel::after{content:"";position:absolute;inset:0;z-index:0;pointer-events:none;border-radius:inherit;}
  .lang-panel::before{background:linear-gradient(125deg,rgba(255,255,255,.22),transparent 38%,transparent 66%,rgba(227,200,120,.10));opacity:.8;}
  .lang-panel::after{inset:-55% -30%;background:radial-gradient(ellipse at 68% 42%,rgba(179,229,209,.18),transparent 46%);filter:blur(15px);animation:liquidDrift 8s ease-in-out infinite alternate;}
  .lang-panel>*{position:relative;z-index:1;}
  @keyframes liquidDrift{from{transform:translate3d(-5%,2%,0) scale(.96)}to{transform:translate3d(7%,-4%,0) scale(1.08)}}
  .theme-panel{width:15rem;}
  .theme-choice{display:flex;align-items:center;gap:.6rem;width:100%;padding:.6rem .75rem;border-radius:.85rem;color:#fff;background:transparent;border:1px solid transparent;text-align:left;transition:background .2s ease,border-color .2s ease,transform .15s ease;}
  .theme-choice:hover{background:rgba(255,255,255,.09);transform:translateX(2px);}
  .theme-choice[aria-pressed="true"]{background:var(--emerald);border-color:rgba(227,200,120,.45);box-shadow:inset 0 1px 0 rgba(255,255,255,.16);}
  .theme-choice .tick{margin-left:auto;opacity:0;transform:scale(.6);transition:opacity .2s ease,transform .2s ease;}
  .theme-choice[aria-pressed="true"] .tick{opacity:1;transform:scale(1);}
  .reveal{opacity:0; transform:translateY(24px); transition:opacity .8s ease, transform .8s ease;}
  .reveal.show{opacity:1; transform:translateY(0);}
  @media (prefers-reduced-motion: reduce){
    .float,.logo-hero,.hero-aura,.spark,.lang-panel::after{animation:none;}
    .reveal{transition:none;opacity:1;transform:none;}
    .btn,.dm-btn,.theme-choice,.lang-panel{transition:none;}
  }
</style>
</head>
<body class="antialiased">

<div class="glow" id="glow"></div>

<nav class="fixed left-0 right-0 z-50 glass" style="top:env(safe-area-inset-top,0px);">
  <div class="max-w-7xl mx-auto px-5 md:px-8 flex items-center justify-between h-16">
    <a href="index.html" class="flex items-center gap-2.5 serif text-xl tracking-wide" style="color:var(--gold-lt)"><img src="assets/logo-128.png" alt="Sovann Khmer logo" class="w-8 h-8">Sovann Khmer</a>
    <div class="flex items-center gap-3">
      <button id="dmBtn" class="dm-btn" aria-expanded="false" aria-controls="themePanel" aria-label="Display Mode" onclick="toggleThemePanel()">
        <svg class="dm-ico" data-mode="light" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" hidden aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="dm-ico" data-mode="dark" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" hidden aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="dm-ico" data-mode="system" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
        <span class="hidden md:inline">Display Mode</span>
      </button>
      <a href="index.html" class="btn btn-ghost rounded-full px-4 py-2 text-sm">Back to Home</a>
    </div>
  </div>
</nav>

<section id="themePanel" class="lang-panel theme-panel glass rounded-2xl p-4 shadow-2xl fixed top-20 right-5 z-50" data-open="false" aria-hidden="true" aria-label="Display mode" inert style="color:var(--text)">
  <p class="text-xs uppercase tracking-[.18em] mb-3" style="color:#fff">Display mode</p>
  <div class="grid gap-1.5">
    <button class="theme-choice" data-theme="dark" aria-pressed="false"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg><span>Dark Mode</span><span class="tick" aria-hidden="true">✓</span></button>
    <button class="theme-choice" data-theme="light" aria-pressed="false"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><span>White Mode</span><span class="tick" aria-hidden="true">✓</span></button>
    <button class="theme-choice" data-theme="system" aria-pressed="true"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg><span>System Mode</span><span class="tick" aria-hidden="true">✓</span></button>
  </div>
</section>

<header class="relative min-h-screen flex items-center justify-center overflow-hidden px-6 py-28" style="background:radial-gradient(ellipse at 50% 18%, #0f3b2c 0%, #0a2a20 48%, #0b0b0a 100%);">
  <div class="hero-aura" aria-hidden="true"></div>
  <span class="spark" style="left:16%;bottom:20%;animation-duration:9s"></span>
  <span class="spark" style="left:30%;bottom:14%;animation-duration:11s;animation-delay:2.2s"></span>
  <span class="spark" style="left:68%;bottom:18%;animation-duration:10s;animation-delay:1.1s"></span>
  <span class="spark" style="left:84%;bottom:26%;animation-duration:12s;animation-delay:3.4s"></span>

  <div class="relative z-10 max-w-xl w-full text-center reveal">
    <img src="assets/logo-128.png" alt="" class="logo-hero mx-auto mb-5">
    <p class="serif italic text-lg mb-2" style="color:var(--gold-lt)">Always here for you</p>
    <h1 class="serif text-5xl md:text-6xl font-semibold" style="color:#F3EEE1">24/7 Service</h1>
    <p class="mt-4 text-sm md:text-base leading-relaxed font-bold" style="color:#fff">Message us any hour of the day or night on Telegram. Scan the code below and we will answer.</p>

    <div class="mt-10 flex justify-center">
      <div class="qr-card float">
        <img src="assets/telegram-qr.png" alt="Telegram QR code for @CHHAYFONG11">
      </div>
    </div>
    <p class="mt-5 serif text-2xl tracking-wide" style="color:var(--gold-lt)">@CHHAYFONG11</p>

    <div class="mt-8 flex flex-wrap items-center justify-center gap-4">
      <a href="https://t.me/CHHAYFONG11" target="_blank" rel="noopener" class="btn btn-gold px-7 py-3 rounded-full text-sm tracking-wide">Open Telegram</a>
      <a href="index.html" class="btn btn-ghost px-7 py-3 rounded-full text-sm tracking-wide" style="color:#F3EEE1">Back to Home</a>
    </div>
  </div>
</header>

<footer class="py-10 px-6 text-center" style="background:var(--charcoal); color:#d8d3c4">
  <p class="serif text-lg mb-1" style="color:var(--gold-lt)">Sovann Khmer</p>
  <p class="text-sm opacity-80">St. 240, Phnom Penh, Cambodia &middot; Open daily 11:00 – 22:30 &middot; +855 11639293</p>
</footer>

<script>
const THEME_KEY='sovann-theme';
function currentTheme(){try{return localStorage.getItem(THEME_KEY)||'system';}catch(e){return 'system';}}
function applyTheme(mode){const root=document.documentElement;if(mode==='dark')root.setAttribute('data-theme','dark');else if(mode==='light')root.setAttribute('data-theme','light');else root.removeAttribute('data-theme');try{localStorage.setItem(THEME_KEY,mode);}catch(e){}document.querySelectorAll('.theme-choice').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.theme===mode)));document.querySelectorAll('.dm-ico').forEach(s=>{if(s.dataset.mode===mode)s.removeAttribute('hidden');else s.setAttribute('hidden','');});}
function toggleThemePanel(force){const panel=document.getElementById('themePanel'),btn=document.getElementById('dmBtn');if(!panel||!btn)return;const open=typeof force==='boolean'?force:panel.dataset.open!=='true';panel.dataset.open=String(open);panel.setAttribute('aria-hidden',String(!open));panel.inert=!open;btn.setAttribute('aria-expanded',String(open));}
document.querySelectorAll('.theme-choice').forEach(b=>b.addEventListener('click',()=>{applyTheme(b.dataset.theme);toggleThemePanel(false);}));
document.addEventListener('keydown',e=>{if(e.key==='Escape')toggleThemePanel(false);});
document.addEventListener('click',e=>{if(!e.target.closest('#themePanel')&&!e.target.closest('#dmBtn'))toggleThemePanel(false);});
applyTheme(currentTheme());

const glow=document.getElementById('glow');
addEventListener('pointermove',e=>{glow.style.left=e.clientX+'px';glow.style.top=e.clientY+'px';},{passive:true});
const io=new IntersectionObserver(es=>es.forEach(en=>{if(en.isIntersecting){en.target.classList.add('show');io.unobserve(en.target);}}),{threshold:.15});
document.querySelectorAll('.reveal').forEach(el=>io.observe(el));
</script>
</body>
</html>
